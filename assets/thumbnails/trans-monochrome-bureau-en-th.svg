<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="darkBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#darkBg)" />

  <!-- Grid Accents -->
  <g opacity="0.15" stroke="#71717a" stroke-width="0.8">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>

  <!-- Top Badge: Monochrome Translation EN -> TH -->
  <g transform="translate(400, 48)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#27272a" stroke="#52525b" stroke-width="1.2" />
    <circle cx="-150" cy="0" r="4" fill="#a1a1aa" />
    <text x="0" y="5" font-family="'Sarabun', 'Roboto', sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#f4f4f5" text-anchor="middle">
      แปลอังกฤษเป็นไทย • MONOCHROME STYLE
    </text>
    <circle cx="150" cy="0" r="4" fill="#a1a1aa" />
  </g>

  <!-- Document Sheet Container (White A4 Paper in Monochrome) -->
  <g transform="translate(190, 85)" filter="url(#cardShadow)">
    <!-- White Paper Base -->
    <rect x="0" y="0" width="420" height="480" rx="6" fill="#fafafa" stroke="#d4d4d8" stroke-width="1" />

    <!-- Top Rule (Black) -->
    <line x1="30" y1="35" x2="390" y2="35" stroke="#000000" stroke-width="2" />

    <!-- Document Title (Black Bold) -->
    <text x="30" y="60" font-family="'Sarabun', 'Roboto', sans-serif" font-size="16" font-weight="800" fill="#000000">
      เอกสารแปลฉบับสมบูรณ์ (English to Thai)
    </text>
    <text x="30" y="78" font-family="'Sarabun', 'Roboto', sans-serif" font-size="10" font-weight="600" fill="#52525b">
      สำนักแปล Monochrome • คุมสัดส่วนและหน้าเท่าเดิม 1:1
    </text>

    <!-- Paragraph Text Mockup (Pure Black lines) -->
    <rect x="30" y="98" width="360" height="4" rx="2" fill="#000000" />
    <rect x="30" y="108" width="330" height="4" rx="2" fill="#27272a" />
    <rect x="30" y="118" width="350" height="4" rx="2" fill="#27272a" />
    <rect x="30" y="128" width="280" height="4" rx="2" fill="#27272a" />

    <!-- Feature: IMAGE REPLACEMENT BOX (สี่เหลี่ยมเปล่าๆ พร้อมคำว่า รูปภาพ ตรงกลาง) -->
    <g transform="translate(30, 148)">
      <rect x="0" y="0" width="360" height="95" rx="3" fill="#f4f4f5" stroke="#000000" stroke-width="1.8" stroke-dasharray="0" />
      <!-- Subtle diagonal corner marks -->
      <line x1="0" y1="0" x2="16" y2="16" stroke="#a1a1aa" stroke-width="0.8" />
      <line x1="360" y1="0" x2="344" y2="16" stroke="#a1a1aa" stroke-width="0.8" />
      <line x1="0" y1="95" x2="16" y2="79" stroke="#a1a1aa" stroke-width="0.8" />
      <line x1="360" y1="95" x2="344" y2="79" stroke="#a1a1aa" stroke-width="0.8" />
      <!-- Centered Label "รูปภาพ" -->
      <rect x="135" y="32" width="90" height="30" rx="4" fill="#000000" />
      <text x="180" y="52" font-family="'Sarabun', 'Roboto', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
        รูปภาพ
      </text>
    </g>

    <!-- Paragraph Text Mockup 2 -->
    <rect x="30" y="260" width="360" height="4" rx="2" fill="#000000" />
    <rect x="30" y="270" width="340" height="4" rx="2" fill="#27272a" />

    <!-- Feature: MONOCHROME TABLE (ตารางเส้นสีดำล้วน พื้นสีขาว/เทา Monochrome) -->
    <g transform="translate(30, 290)">
      <!-- Table Outer Border -->
      <rect x="0" y="0" width="360" height="120" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <!-- Header Row (Black Background with White Text) -->
      <rect x="0" y="0" width="360" height="28" fill="#000000" />
      <text x="15" y="19" font-family="'Sarabun', 'Roboto', sans-serif" font-size="11" font-weight="700" fill="#ffffff">ลำดับ</text>
      <text x="65" y="19" font-family="'Sarabun', 'Roboto', sans-serif" font-size="11" font-weight="700" fill="#ffffff">ข้อกำหนดทางเทคนิค (แปลไทย)</text>
      <text x="280" y="19" font-family="'Sarabun', 'Roboto', sans-serif" font-size="11" font-weight="700" fill="#ffffff">สถานะผลลัพธ์</text>

      <!-- Grid Dividers (Pure Black) -->
      <line x1="48" y1="0" x2="48" y2="120" stroke="#000000" stroke-width="1" />
      <line x1="265" y1="0" x2="265" y2="120" stroke="#000000" stroke-width="1" />

      <line x1="0" y1="58" x2="360" y2="58" stroke="#000000" stroke-width="1" />
      <line x1="0" y1="88" x2="360" y2="88" stroke="#000000" stroke-width="1" />

      <!-- Row 1 -->
      <text x="24" y="47" font-family="'Roboto', sans-serif" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">1</text>
      <text x="58" y="47" font-family="'Sarabun', sans-serif" font-size="10.5" font-weight="500" fill="#000000">รักษาจำนวนหน้าเท่าเดิม 1:1 ไม่ปัดหน้าใหม่</text>
      <text x="312" y="47" font-family="'Sarabun', sans-serif" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">ตรงต้นฉบับ</text>

      <!-- Row 2 -->
      <text x="24" y="77" font-family="'Roboto', sans-serif" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">2</text>
      <text x="58" y="77" font-family="'Sarabun', sans-serif" font-size="10.5" font-weight="500" fill="#000000">แปลงรูปภาพทั้งหมดเป็นกล่องระบุคำว่า "รูปภาพ"</text>
      <text x="312" y="77" font-family="'Sarabun', sans-serif" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">ตรงต้นฉบับ</text>

      <!-- Row 3 -->
      <text x="24" y="107" font-family="'Roboto', sans-serif" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">3</text>
      <text x="58" y="107" font-family="'Sarabun', sans-serif" font-size="10.5" font-weight="500" fill="#000000">เปลี่ยนเส้นสีและพื้นหลังสีเป็น Monochrome ดำล้วน</text>
      <text x="312" y="107" font-family="'Sarabun', sans-serif" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">ตรงต้นฉบับ</text>
    </g>

    <!-- Bottom Page Footer (Page 1 of 1 Strict Preservation) -->
    <line x1="30" y1="435" x2="390" y2="435" stroke="#000000" stroke-width="1" />
    <text x="30" y="455" font-family="'Sarabun', sans-serif" font-size="9.5" font-weight="500" fill="#52525b">
      Monochrome Translation Ready (.docx)
    </text>
    <text x="390" y="455" font-family="'Sarabun', sans-serif" font-size="9.5" font-weight="700" fill="#000000" text-anchor="end">
      หน้า 1 จาก 1 (รักษาจำนวนหน้าเดิม)
    </text>
  </g>
</svg>
