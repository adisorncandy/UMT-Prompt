<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgBidding" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0f291e" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#091410" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#050a07" stop-opacity="1" />
    </radialGradient>
    <filter id="docShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blueWordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#bgBidding)" />

  <!-- Subtle Tactical Grid Pattern -->
  <g opacity="0.12" stroke="#34d399" stroke-width="0.8">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="150" y1="0" x2="150" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="650" y1="0" x2="650" y2="600" />
  </g>

  <!-- Top Header Banner -->
  <g transform="translate(400, 48)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#064e3b" stroke="#10b981" stroke-width="1.2" opacity="0.9" />
    <circle cx="-210" cy="0" r="5" fill="#34d399" />
    <text x="0" y="5" font-family="'Sarabun', 'Roboto', sans-serif" font-size="13.5" font-weight="700" letter-spacing="1" fill="#ecfdf5" text-anchor="middle">
      📑 TOR &amp; BID • ขีดเส้น Mark Catalog &amp; เติมตาราง Comply ใน Word
    </text>
    <circle cx="210" cy="0" r="5" fill="#34d399" />
  </g>

  <!-- LEFT: Catalog PDF Document (with Mark Lines & Page Numbers) -->
  <g transform="translate(50, 95)" filter="url(#docShadow)">
    <!-- PDF Sheet Base -->
    <rect x="0" y="0" width="320" height="420" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />

    <!-- Top PDF Header Badge -->
    <rect x="0" y="0" width="320" height="36" rx="8" fill="#dc2626" />
    <rect x="0" y="28" width="320" height="8" fill="#dc2626" />
    <text x="16" y="23" font-family="'Roboto', sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="0.5">
      PDF CATALOG (ใส่เลขหน้าจริง)
    </text>
    <text x="304" y="23" font-family="'Roboto', sans-serif" font-size="10" font-weight="700" fill="#fecaca" text-anchor="end">
      หน้า 12 / 48
    </text>

    <!-- Catalog Content Mockup -->
    <g transform="translate(18, 50)">
      <!-- Title & Model -->
      <text x="0" y="14" font-family="'Roboto', sans-serif" font-size="12" font-weight="800" fill="#0f172a">
        SECTION 3.2: TACTICAL TRANSCEIVER
      </text>
      <text x="0" y="28" font-family="'Roboto', sans-serif" font-size="10.5" font-weight="600" fill="#2563eb">
        Model: TR-9800M (Mil-Spec 810H)
      </text>

      <!-- Spec Text Block 1 -->
      <rect x="0" y="42" width="284" height="4" rx="2" fill="#94a3b8" />
      <rect x="0" y="50" width="260" height="4" rx="2" fill="#cbd5e1" />

      <!-- Mark Compliance Line 1 (Green Underline + Tag) -->
      <g transform="translate(0, 62)">
        <rect x="0" y="0" width="284" height="24" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
        <text x="8" y="16" font-family="'Roboto', sans-serif" font-size="10" font-weight="700" fill="#065f46">
          ✔ Output Power: 50W (Max), Band: 30-512 MHz
        </text>
        <!-- FreeText Annotation Tag -->
        <rect x="230" y="3" width="48" height="18" rx="3" fill="#10b981" />
        <text x="254" y="16" font-family="'Roboto', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">
          ข้อ 1.1 (1)
        </text>
      </g>

      <!-- Spec Text Block 2 -->
      <rect x="0" y="98" width="284" height="4" rx="2" fill="#94a3b8" />
      <rect x="0" y="106" width="240" height="4" rx="2" fill="#cbd5e1" />

      <!-- Mark Compliance Line 2 -->
      <g transform="translate(0, 118)">
        <rect x="0" y="0" width="284" height="24" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
        <text x="8" y="16" font-family="'Roboto', sans-serif" font-size="10" font-weight="700" fill="#065f46">
          ✔ Waterproof IP68, Operating Temp: -40°C to +70°C
        </text>
        <rect x="220" y="3" width="58" height="18" rx="3" fill="#10b981" />
        <text x="249" y="16" font-family="'Roboto', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">
          ข้อ 1.1 (1) (12)
        </text>
      </g>

      <!-- Unverified Spec Text (เว้นไว้ ไม่ Mark เดา) -->
      <g transform="translate(0, 154)">
        <rect x="0" y="0" width="284" height="20" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 2" />
        <text x="8" y="14" font-family="'Sarabun', sans-serif" font-size="9" font-weight="500" fill="#94a3b8">
          * ข้อมูลทั่วไป (ไม่มี TOR รองรับชัดเจน → เว้นไว้ ไม่ Mark)
        </text>
      </g>

      <!-- Mini Spec Table in Catalog -->
      <g transform="translate(0, 186)">
        <rect x="0" y="0" width="284" height="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
        <rect x="0" y="0" width="284" height="20" fill="#e2e8f0" />
        <text x="8" y="14" font-family="'Roboto', sans-serif" font-size="9" font-weight="700" fill="#334155">
          PARAMETER
        </text>
        <text x="180" y="14" font-family="'Roboto', sans-serif" font-size="9" font-weight="700" fill="#334155">
          SPECIFICATION
        </text>
        <line x1="0" y1="42" x2="284" y2="42" stroke="#e2e8f0" stroke-width="1" />
        <line x1="0" y1="66" x2="284" y2="66" stroke="#e2e8f0" stroke-width="1" />
        <!-- Row 1 with line mark -->
        <text x="8" y="34" font-family="'Roboto', sans-serif" font-size="8.5" fill="#475569">Mesh Nodes</text>
        <text x="180" y="34" font-family="'Roboto', sans-serif" font-size="8.5" font-weight="700" fill="#059669">Up to 64 Hops ✔</text>
        <!-- Row 2 -->
        <text x="8" y="56" font-family="'Roboto', sans-serif" font-size="8.5" fill="#475569">Encryption</text>
        <text x="180" y="56" font-family="'Roboto', sans-serif" font-size="8.5" font-weight="700" fill="#059669">AES-256 Type 1 ✔</text>
      </g>
    </g>

    <!-- Page Number Indicator at Bottom -->
    <line x1="18" y1="390" x2="302" y2="390" stroke="#e2e8f0" stroke-width="1" />
    <text x="160" y="407" font-family="'Roboto', sans-serif" font-size="9.5" font-weight="700" fill="#64748b" text-anchor="middle">
      - PAGE 12 -
    </text>
  </g>

  <!-- CENTER: Dynamic Linking Arrow (Sync Data) -->
  <g transform="translate(378, 280)">
    <circle cx="22" cy="0" r="22" fill="#047857" stroke="#34d399" stroke-width="2" />
    <path d="M 14 -7 L 27 0 L 14 7 Z" fill="#ffffff" />
  </g>

  <!-- RIGHT: Word Compliance Table Document (Filled Details, Exact Format) -->
  <g transform="translate(430, 95)" filter="url(#docShadow)">
    <!-- Word Doc Sheet Base -->
    <rect x="0" y="0" width="320" height="420" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />

    <!-- Top Word Header Badge -->
    <rect x="0" y="0" width="320" height="36" rx="8" fill="#1d4ed8" />
    <rect x="0" y="28" width="320" height="8" fill="#1d4ed8" />
    <text x="16" y="23" font-family="'Roboto', sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="0.5">
      WORD COMPLIANCE TABLE (คง FORMAT)
    </text>
    <text x="304" y="23" font-family="'Roboto', sans-serif" font-size="9.5" font-weight="600" fill="#bfdbfe" text-anchor="end">
      .DOCX
    </text>

    <!-- Table Structure in Word -->
    <g transform="translate(14, 50)">
      <text x="0" y="14" font-family="'Sarabun', sans-serif" font-size="12" font-weight="800" fill="#0f172a">
        ตารางเปรียบเทียบคุณลักษณะเฉพาะ (TOR)
      </text>
      <text x="0" y="27" font-family="'Sarabun', sans-serif" font-size="9.5" font-weight="500" fill="#64748b">
        ระบุ บท, หน้า, รุ่น/Model และรายละเอียดหลักฐานตรง Catalog
      </text>

      <!-- Table Header & Cells -->
      <g transform="translate(0, 36)">
        <!-- Table Border -->
        <rect x="0" y="0" width="292" height="270" fill="#ffffff" stroke="#1e293b" stroke-width="1.2" />
        
        <!-- Header Row -->
        <rect x="0" y="0" width="292" height="28" fill="#1e293b" />
        <text x="24" y="18" font-family="'Sarabun', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">ข้อ TOR</text>
        <text x="76" y="18" font-family="'Sarabun', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">บท / หน้า</text>
        <text x="140" y="18" font-family="'Sarabun', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">รุ่น / Model</text>
        <text x="228" y="18" font-family="'Sarabun', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">รายละเอียดที่ยืนยัน</text>

        <!-- Vertical Dividers -->
        <line x1="48" y1="0" x2="48" y2="270" stroke="#1e293b" stroke-width="1" />
        <line x1="104" y1="0" x2="104" y2="270" stroke="#1e293b" stroke-width="1" />
        <line x1="176" y1="0" x2="176" y2="270" stroke="#1e293b" stroke-width="1" />

        <!-- Row 1 -->
        <line x1="0" y1="78" x2="292" y2="78" stroke="#cbd5e1" stroke-width="1" />
        <text x="24" y="48" font-family="'Roboto', sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">1.1 (1)</text>
        
        <text x="76" y="44" font-family="'Sarabun', sans-serif" font-size="8.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">บท 3.2</text>
        <text x="76" y="58" font-family="'Roboto', sans-serif" font-size="8.5" font-weight="700" fill="#047857" text-anchor="middle">หน้า 12</text>

        <text x="140" y="52" font-family="'Roboto', sans-serif" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">TR-9800M</text>

        <text x="182" y="42" font-family="'Sarabun', sans-serif" font-size="7.5" font-weight="500" fill="#0f172a">กำลังส่ง 50W Max</text>
        <text x="182" y="54" font-family="'Sarabun', sans-serif" font-size="7.5" font-weight="500" fill="#0f172a">ย่าน 30-512 MHz</text>
        <text x="182" y="66" font-family="'Sarabun', sans-serif" font-size="7.5" font-weight="700" fill="#047857">✔ Comply ตรง TOR</text>

        <!-- Row 2 -->
        <line x1="0" y1="140" x2="292" y2="140" stroke="#cbd5e1" stroke-width="1" />
        <text x="24" y="100" font-family="'Roboto', sans-serif" font-size="7.5" font-weight="700" fill="#0f172a" text-anchor="middle">1.1 (1) (12)</text>
        
        <text x="76" y="98" font-family="'Sarabun', sans-serif" font-size="8.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">บท 3.2</text>
        <text x="76" y="112" font-family="'Roboto', sans-serif" font-size="8.5" font-weight="700" fill="#047857" text-anchor="middle">หน้า 12</text>

        <text x="140" y="106" font-family="'Roboto', sans-serif" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">TR-9800M</text>

        <text x="182" y="98" font-family="'Sarabun', sans-serif" font-size="7.5" font-weight="500" fill="#0f172a">กันน้ำระดับ IP68</text>
        <text x="182" y="110" font-family="'Sarabun', sans-serif" font-size="7.5" font-weight="500" fill="#0f172a">อุณหภูมิ -40..+70°C</text>
        <text x="182" y="122" font-family="'Sarabun', sans-serif" font-size="7.5" font-weight="700" fill="#047857">✔ Comply ตรง TOR</text>

        <!-- Row 3 -->
        <line x1="0" y1="202" x2="292" y2="202" stroke="#cbd5e1" stroke-width="1" />
        <text x="24" y="165" font-family="'Roboto', sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">1.2 (3)</text>
        
        <text x="76" y="162" font-family="'Sarabun', sans-serif" font-size="8.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">บท 3.2</text>
        <text x="76" y="176" font-family="'Roboto', sans-serif" font-size="8.5" font-weight="700" fill="#047857" text-anchor="middle">หน้า 12</text>

        <text x="140" y="170" font-family="'Roboto', sans-serif" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">TR-9800M</text>

        <text x="182" y="162" font-family="'Sarabun', sans-serif" font-size="7.5" font-weight="500" fill="#0f172a">Mesh Nodes 64 Hops</text>
        <text x="182" y="174" font-family="'Sarabun', sans-serif" font-size="7.5" font-weight="500" fill="#0f172a">การเข้ารหัส AES-256</text>
        <text x="182" y="186" font-family="'Sarabun', sans-serif" font-size="7.5" font-weight="700" fill="#047857">✔ Comply ตรง TOR</text>

        <!-- Row 4 Placeholder -->
        <rect x="1" y="203" width="290" height="66" fill="#f8fafc" />
        <text x="146" y="238" font-family="'Sarabun', sans-serif" font-size="9" font-weight="500" fill="#94a3b8" text-anchor="middle">
          (คง Layout, ฟอนต์ และ Format เดิมของไฟล์ Word 100%)
        </text>
      </g>
    </g>

    <line x1="14" y1="390" x2="306" y2="390" stroke="#cbd5e1" stroke-width="1" />
    <text x="160" y="407" font-family="'Sarabun', sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="middle">
      ตรวจสอบความถูกต้อง 100% ก่อนส่งไฟล์
    </text>
  </g>

  <!-- Bottom Badges Bar -->
  <g transform="translate(400, 552)">
    <rect x="-350" y="-18" width="700" height="36" rx="10" fill="#061f15" stroke="#10b981" stroke-width="1" opacity="0.95" />
    <text x="-330" y="5" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#34d399">IN:</text>
    <text x="-305" y="5" font-family="'Sarabun', sans-serif" font-size="11" font-weight="500" fill="#e2e8f0">Catalog PDF ใส่เลขหน้า + ตาราง Comply (Word)</text>
    <text x="40" y="5" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#60a5fa">OUT:</text>
    <text x="72" y="5" font-family="'Sarabun', sans-serif" font-size="11" font-weight="600" fill="#ffffff">Catalog PDF ขีดเส้น Mark + ตาราง Word กรอกครบถ้วน</text>
  </g>
</svg>
