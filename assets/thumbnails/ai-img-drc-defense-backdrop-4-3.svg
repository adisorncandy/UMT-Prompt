<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#122538" stop-opacity="0.65" />
      <stop offset="60%" stop-color="#0a0e14" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#05070a" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101826" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b1019" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="nokiaBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#124191" />
      <stop offset="100%" stop-color="#1e60c6" />
    </linearGradient>
    <linearGradient id="greyLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="domeShieldGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#124191" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern for Tactical Background -->
    <pattern id="tacticalGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="0" cy="0" r="1" fill="#475569" fill-opacity="0.4" />
    </pattern>
  </defs>

  <!-- 1. Background Base -->
  <rect width="800" height="600" fill="#070a0e" />
  <rect width="800" height="600" fill="url(#bgGlow)" />
  <rect width="800" height="600" fill="url(#tacticalGrid)" opacity="0.75" />

  <!-- Defense Tech Background Ambience & Perspective Lines -->
  <g opacity="0.35">
    <line x1="0" y1="520" x2="800" y2="520" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="560" x2="800" y2="560" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="150" y1="600" x2="350" y2="450" stroke="#1e293b" stroke-width="0.8" />
    <line x1="650" y1="600" x2="450" y2="450" stroke="#1e293b" stroke-width="0.8" />
  </g>

  <!-- ================= BACKGROUND DEFENSE TECH ELEMENTS (Subtle, Not Overpowering) ================= -->

  <!-- Anti-Drone Radar Dome & Shield (Center Left to Center) -->
  <g id="anti-drone-system" opacity="0.85">
    <!-- Radar Protective Dome (Hemispherical Shield) -->
    <path d="M 220 500 A 180 180 0 0 1 580 500 Z" fill="url(#domeShieldGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.6" filter="url(#softGlow)" />
    <path d="M 260 500 A 140 140 0 0 1 540 500 Z" fill="none" stroke="#124191" stroke-width="0.8" stroke-opacity="0.5" />
    <path d="M 300 500 A 100 100 0 0 1 500 500 Z" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="3 3" />
    <!-- Radar Scan Arc -->
    <path d="M 400 500 L 490 340 A 180 180 0 0 0 400 320 Z" fill="#38bdf8" fill-opacity="0.08" />
    <line x1="400" y1="500" x2="490" y2="340" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" filter="url(#softGlow)" />

    <!-- Radar Dome Physical Base Device -->
    <ellipse cx="400" cy="500" rx="35" ry="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <path d="M 380 500 A 20 20 0 0 1 420 500 Z" fill="#334155" stroke="#64748b" stroke-width="1" />
    <circle cx="400" cy="485" r="3" fill="#38bdf8" filter="url(#softGlow)" />
  </g>

  <!-- Jammer: Bomb Suit Operator Silhouette (Center Right Background) -->
  <g id="jammer-bombsuit" opacity="0.55" transform="translate(560, 360)">
    <!-- Bomb Suit Helmet / Visor -->
    <ellipse cx="40" cy="30" rx="14" ry="16" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <path d="M 32 28 Q 40 24 48 28 Q 46 35 34 35 Z" fill="#0f172a" stroke="#124191" stroke-width="0.8" />
    <path d="M 34 29 Q 40 26 46 29" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" opacity="0.8" />
    
    <!-- Massive EOD Heavy Collar & Chest Armor (Bomb Suit Body) -->
    <path d="M 22 45 Q 40 40 58 45 L 68 75 L 72 135 L 8 135 L 12 75 Z" fill="#141c28" stroke="#334155" stroke-width="1.2" />
    <!-- Chest Rig / Jammer Control Unit on Suit -->
    <rect x="28" y="60" width="24" height="30" rx="3" fill="#0b0f17" stroke="#475569" stroke-width="0.8" />
    <circle cx="34" cy="70" r="2" fill="#ef4444" />
    <circle cx="42" cy="70" r="2" fill="#22c55e" />
    <rect x="33" y="78" width="14" height="6" fill="#1e293b" />
    <!-- Jammer Backpack Antenna Rod -->
    <line x1="26" y1="50" x2="16" y2="10" stroke="#64748b" stroke-width="2" />
    <circle cx="16" cy="10" r="2.5" fill="#38bdf8" filter="url(#softGlow)" />
    <!-- Jammer Signal Wave emission (subtle) -->
    <path d="M 12 6 A 8 8 0 0 0 10 16" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6" stroke-dasharray="2 2" />
    <path d="M 8 2 A 14 14 0 0 0 5 18" fill="none" stroke="#124191" stroke-width="1" opacity="0.5" />
    <!-- Arms & Heavy Legs Silhouette -->
    <path d="M 12 75 L 2 120 L 14 125 L 22 85 Z" fill="#0f172a" />
    <path d="M 68 75 L 78 120 L 66 125 L 58 85 Z" fill="#0f172a" />
    <rect x="18" y="135" width="18" height="50" fill="#0d131c" stroke="#1e293b" stroke-width="0.8" />
    <rect x="44" y="135" width="18" height="50" fill="#0d131c" stroke="#1e293b" stroke-width="0.8" />
  </g>

  <!-- Tactical Radio: Mesh Network Link & Airborne UAV (Left & Upper Sky) -->
  <g id="tactical-mesh-network" opacity="0.75">
    <!-- Airborne UAV Drone Silhouette (Upper Left / Center Sky) -->
    <g transform="translate(240, 180) scale(0.8)">
      <!-- UAV Fuselage & Wings -->
      <path d="M 50 15 Q 60 20 70 20 L 110 24 L 110 27 L 70 26 L 68 50 L 58 52 L 60 27 L 50 27 L 48 36 L 42 36 L 44 26 L 2 26 L 2 23 L 44 20 Z" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <circle cx="56" cy="22" r="2" fill="#38bdf8" filter="url(#softGlow)" />
      <!-- UAV Sensor Pod -->
      <circle cx="64" cy="28" r="3" fill="#0f172a" stroke="#64748b" stroke-width="0.5" />
    </g>

    <!-- Ground Tactical Radio Station & Antenna (Bottom Left) -->
    <g transform="translate(130, 440)">
      <!-- Antenna Mast -->
      <line x1="30" y1="60" x2="30" y2="0" stroke="#64748b" stroke-width="1.5" />
      <line x1="20" y1="12" x2="40" y2="12" stroke="#64748b" stroke-width="1" />
      <line x1="24" y1="24" x2="36" y2="24" stroke="#64748b" stroke-width="1" />
      <circle cx="30" cy="0" r="3" fill="#38bdf8" filter="url(#softGlow)" />
      <!-- Tactical Ground Unit Base -->
      <rect x="15" y="60" width="30" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="22" cy="70" r="1.5" fill="#22c55e" />
      <circle cx="28" cy="70" r="1.5" fill="#38bdf8" />
    </g>

    <!-- Mesh Network Glowing Data Links (Connecting Ground, Jammer, Radar & UAV) -->
    <!-- Ground Antenna to UAV -->
    <line x1="160" y1="440" x2="285" y2="200" stroke="#124191" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#softGlow)" />
    <line x1="160" y1="440" x2="285" y2="200" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="6 4" />
    
    <!-- UAV to Radar Dome -->
    <line x1="285" y1="200" x2="400" y2="480" stroke="#124191" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.6" />
    <line x1="285" y1="200" x2="400" y2="480" stroke="#38bdf8" stroke-width="0.6" stroke-dasharray="5 5" opacity="0.8" />
    
    <!-- Radar Dome to Jammer Operator -->
    <line x1="400" y1="480" x2="576" y2="370" stroke="#124191" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6" />
    <line x1="400" y1="480" x2="576" y2="370" stroke="#38bdf8" stroke-width="0.6" stroke-dasharray="4 4" opacity="0.7" />

    <!-- Mesh Topology Network Nodes (Pulsing Dots) -->
    <circle cx="160" cy="440" r="3.5" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="285" cy="200" r="4" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="400" cy="480" r="3.5" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="576" cy="370" r="3.5" fill="#38bdf8" filter="url(#softGlow)" />
  </g>

  <!-- ================= UPPER CENTER SLOGAN ================= -->
  <!-- Slogan "KEEP AI ON THE SKY" (Subtly positioned in upper-center area) -->
  <g id="upper-center-slogan" transform="translate(400, 110)">
    <!-- Sleek subtle pill border -->
    <rect x="-105" y="-14" width="210" height="28" rx="14" fill="#0b1320" fill-opacity="0.75" stroke="#124191" stroke-width="1" stroke-opacity="0.6" />
    <!-- Small subtle glowing node -->
    <circle cx="-88" cy="0" r="2.5" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="88" cy="0" r="2.5" fill="#38bdf8" filter="url(#softGlow)" />
    <!-- Text: Roboto font -->
    <text x="0" y="4" font-family="Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#93c5fd" text-anchor="middle">
      KEEP AI ON THE SKY
    </text>
  </g>

  <!-- ================= TOP HEADER SECTION OF BACKDROP ================= -->
  <!-- Header Background Bar & Separator Line -->
  <rect x="0" y="0" width="800" height="85" fill="url(#headerGrad)" />
  <line x1="30" y1="85" x2="770" y2="85" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
  <line x1="30" y1="85" x2="280" y2="85" stroke="#124191" stroke-width="2" stroke-opacity="0.8" />

  <!-- Top-Left: Grey DRC Logo | Digital Research & Consulting Co.,Ltd -->
  <g id="top-left-logo-section" transform="translate(40, 24)">
    <!-- DRC Grey Emblem / Monogram -->
    <g transform="translate(0, 2)">
      <!-- Outer Hex Shield Badge in Grey -->
      <polygon points="18,0 36,10 36,32 18,42 0,32 0,10" fill="#1e293b" stroke="url(#greyLogoGrad)" stroke-width="1.8" />
      <!-- DRC Monogram Text in Grey -->
      <text x="18" y="26" font-family="Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5" fill="url(#greyLogoGrad)" text-anchor="middle">
        DRC
      </text>
    </g>

    <!-- Vertical Divider Line -->
    <line x1="48" y1="4" x2="48" y2="40" stroke="#475569" stroke-width="1.5" stroke-opacity="0.8" />

    <!-- Company Name: Digital Research & Consulting Co.,Ltd (Roboto Font, Near Logo) -->
    <g transform="translate(60, 16)">
      <text x="0" y="7" font-family="Roboto, sans-serif" font-size="14.5" font-weight="700" letter-spacing="0.5" fill="#f1f5f9">
        Digital Research &amp;
      </text>
      <text x="0" y="24" font-family="Roboto, sans-serif" font-size="12.5" font-weight="500" letter-spacing="0.3" fill="#94a3b8">
        Consulting Co.,Ltd
      </text>
    </g>
  </g>

  <!-- Top-Right: QR Code & www.drc.co.th -->
  <g id="top-right-qr-section" transform="translate(630, 22)">
    <!-- QR Code Graphic Container -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="44" height="44" rx="5" fill="#ffffff" />
      <!-- QR Position Finder Markers -->
      <rect x="4" y="4" width="12" height="12" fill="#0b0f17" />
      <rect x="6" y="6" width="8" height="8" fill="#ffffff" />
      <rect x="7.5" y="7.5" width="5" height="5" fill="#0b0f17" />

      <rect x="28" y="4" width="12" height="12" fill="#0b0f17" />
      <rect x="30" y="6" width="8" height="8" fill="#ffffff" />
      <rect x="31.5" y="7.5" width="5" height="5" fill="#0b0f17" />

      <rect x="4" y="28" width="12" height="12" fill="#0b0f17" />
      <rect x="6" y="30" width="8" height="8" fill="#ffffff" />
      <rect x="7.5" y="31.5" width="5" height="5" fill="#0b0f17" />

      <!-- QR Inner Matrix Pixels -->
      <rect x="18" y="6" width="3" height="3" fill="#0b0f17" />
      <rect x="22" y="10" width="3" height="3" fill="#0b0f17" />
      <rect x="18" y="18" width="3" height="3" fill="#0b0f17" />
      <rect x="24" y="18" width="4" height="4" fill="#0b0f17" />
      <rect x="18" y="28" width="3" height="3" fill="#0b0f17" />
      <rect x="28" y="22" width="3" height="3" fill="#0b0f17" />
      <rect x="34" y="28" width="4" height="4" fill="#0b0f17" />
      <rect x="28" y="34" width="3" height="3" fill="#0b0f17" />
    </g>

    <!-- Website Text: www.drc.co.th (Roboto Font, Nokia Blue Tint / White) -->
    <g transform="translate(54, 15)">
      <text x="0" y="8" font-family="Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1" fill="#64748b">
        OFFICIAL WEB
      </text>
      <text x="0" y="22" font-family="Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.4" fill="#38bdf8">
        www.drc.co.th
      </text>
    </g>
  </g>

  <!-- Corner Tech Accent Decals (4:3 Backdrop Styling) -->
  <g opacity="0.4">
    <!-- Bottom-Left Decal -->
    <path d="M 30 570 L 30 550 L 50 550" fill="none" stroke="#475569" stroke-width="1.5" />
    <!-- Bottom-Right Decal -->
    <path d="M 770 570 L 770 550 L 750 550" fill="none" stroke="#475569" stroke-width="1.5" />
    <!-- Top-Left Decal -->
    <path d="M 30 15 L 15 15 L 15 30" fill="none" stroke="#475569" stroke-width="1.5" />
    <!-- Top-Right Decal -->
    <path d="M 770 15 L 785 15 L 785 30" fill="none" stroke="#475569" stroke-width="1.5" />
  </g>
</svg>
